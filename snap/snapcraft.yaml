name: freetoken
base: core24
version: '0.2.1'
adopt-info: freetoken
title: FreeToken
icon: snap/gui/freetoken.png
summary: Run large Mixture-of-Experts language models on a local NVIDIA GPU
description: |
  FreeToken is an edge-native Mixture-of-Experts serving engine. It runs
  frontier-scale open-weight models on consumer NVIDIA GPUs by sharing the
  work between the GPU, the CPU and host memory, and serves them through
  OpenAI and Anthropic-compatible HTTP APIs.

  For a graphical interface, use freetoken-desktop, which manages its
  own engine and models.

  **Examples**

     freetoken serve --model ~/models/Qwen3.6-35B-A3B
     freetoken serve --model Qwen/Qwen3.6-35B-A3B --port 1919
     freetoken shell
     freetoken ctl stats
     freetoken checkpoint --model ~/models/<hf-dir> --out ~/models/<ftw-dir>

  **Requirements**

  Local inference requires an NVIDIA GPU (RTX 30 series or newer) with
  driver 580 or newer and the CUDA component:

     sudo snap install freetoken+cuda

  The remote chat shell and control commands work without the component.

  **Files**

  Models downloaded from Hugging Face and runtime caches are kept in
  ~/snap/freetoken/common. Local models can be read from your home
  directory. For models on USB drives and other removable media
  (/media, /mnt), run:

     sudo snap connect freetoken:removable-media

  An optional background service is disabled until a model is configured
  with snap set.
license: Apache-2.0
grade: stable
confinement: strict
website: https://www.flashml.ai/
source-code:
  - https://github.com/FlashML-org/FreeToken
  - https://github.com/sidalit/freetoken-snap
issues:
  - https://github.com/FlashML-org/FreeToken/issues
  - https://github.com/sidalit/freetoken-snap/issues
contact: https://github.com/sidalit/freetoken-snap/issues

assumes:
  - snapd2.68

platforms:
  amd64:

plugs:
  # Python workers need private POSIX semaphores and shared memory.
  shmem:
    interface: shared-memory
    private: true

environment:
  # Prefer the virtual environment over the system Python.
  PATH: $SNAP/bin:$SNAP/usr/bin:$PATH
  SNAP_COMPONENTS: /snap/$SNAP_INSTANCE_NAME/components/$SNAP_REVISION
  PYTHONPATH: /snap/$SNAP_INSTANCE_NAME/components/$SNAP_REVISION/cuda/site-packages
  LD_LIBRARY_PATH: $SNAP_LIBRARY_PATH
  TRITON_LIBCUDA_PATH: /var/lib/snapd/lib/gl
  CC: $SNAP/bin/freetoken-cc
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONNOUSERSITE: '1'
  HF_HUB_DISABLE_TELEMETRY: '1'

apps:
  freetoken:
    command: bin/freetoken-launch
    plugs:
      - home
      - removable-media
      - network
      - network-bind
      - opengl
      - shmem

  daemon:
    command: bin/freetoken-daemon
    daemon: simple
    install-mode: disable
    restart-condition: on-failure
    stop-timeout: 60s
    plugs:
      - removable-media
      - network
      - network-bind
      - opengl
      - shmem

parts:
  freetoken:
    plugin: nil
    source: https://github.com/FlashML-org/FreeToken.git
    source-tag: v$SNAPCRAFT_PROJECT_VERSION
    source-depth: 1
    build-packages:
      - binutils
      - curl
      - jq
      - python3-venv
    override-build: |
      /usr/bin/python3 -m venv "$CRAFT_PART_INSTALL"

      case "$SNAPCRAFT_PROJECT_VERSION" in
        git-*)
          manifest=$(curl -fsSL --retry 3 \
            https://github.com/FlashML-org/FreeToken/releases/download/nightly/engine-linux_x86_64.json)
          jq -e '.schema == 1 and .platform == "linux_x86_64" and .python == "cp312" and .cuda == "cu130"' \
            <<< "$manifest" > /dev/null
          commit=$(jq -er '.commit | select(test("^[0-9a-f]{7,40}$"))' <<< "$manifest")
          runtime=$(jq -er '.runtime | .url + "#sha256=" + (.sha256 | select(test("^[0-9a-f]{64}$")))' <<< "$manifest")
          kernels=$(jq -er '.kernel_cache | .url + "#sha256=" + (.sha256 | select(test("^[0-9a-f]{64}$")))' <<< "$manifest")
          craftctl set version="git-${commit:0:7}"
          echo "Packaging nightly wheels from upstream commit $commit"
          ;;
        *)
          release="https://github.com/FlashML-org/FreeToken/releases/download/v$SNAPCRAFT_PROJECT_VERSION"
          runtime="$release/freetoken-$SNAPCRAFT_PROJECT_VERSION-cp312-cp312-manylinux_2_27_x86_64.whl"
          kernels="$release/freetoken_kernel_cache-$SNAPCRAFT_PROJECT_VERSION%2Bcu130-py3-none-linux_x86_64.whl"
          ;;
      esac

      "$CRAFT_PART_INSTALL/bin/python3" -m pip install --no-cache-dir --no-compile "$runtime" "$kernels"

      site_packages=$("$CRAFT_PART_INSTALL/bin/python3" -c 'import sysconfig; print(sysconfig.get_path("purelib"))')
      find "$site_packages/freetoken" -name '*.so' -exec strip --strip-unneeded {} +
      find "$site_packages/triton/_C" -name '*.so' -exec strip --strip-debug {} +
      install -Dm644 LICENSE "$CRAFT_PART_INSTALL/share/doc/freetoken/LICENSE"

      # The environment runs on the base snap's Python 3.12.
      find "$CRAFT_PART_INSTALL/bin" -type f -exec \
        sed -i "1 s|^#!$CRAFT_PART_INSTALL/bin/python3$|#!/usr/bin/env python3|" {} +
    organize:
      'lib/python3.*/site-packages/torch*': (component/cuda)/site-packages/
      'lib/python3.*/site-packages/functorch': (component/cuda)/site-packages/
      'lib/python3.*/site-packages/triton*': (component/cuda)/site-packages/
      'lib/python3.*/site-packages/nvidia*': (component/cuda)/site-packages/
      'lib/python3.*/site-packages/cuda*': (component/cuda)/site-packages/
      'lib/python3.*/site-packages/freetoken_kernel_cache*': (component/cuda)/site-packages/
    prime:
      # FreeToken's extensions and CUDA kernel cache are already compiled.
      - -(component/cuda)/site-packages/torch/include
      - -(component/cuda)/site-packages/triton/backends/nvidia/lib/cupti*/*.a
      - -(component/cuda)/site-packages/nvidia/*/lib/*.a
      - -lib/python3.*/site-packages/numpy/**/tests

  # Triton still needs a C compiler for its CUDA driver launcher.
  toolchain:
    plugin: nil
    stage-packages:
      - gcc
      - binutils
      - libc6-dev
      - libgcc-s1
      - libpython3.12-dev
    override-build: |
      craftctl default
      # Resolve the sysroot's /lib paths against the base's C runtime.
      mkdir -p "$CRAFT_PART_INSTALL/lib/x86_64-linux-gnu"
      for file in libc.so.6 libm.so.6; do
        ln -sf "/usr/lib/x86_64-linux-gnu/$file" "$CRAFT_PART_INSTALL/lib/x86_64-linux-gnu/$file"
      done
      ln -sf ../../usr/lib/x86_64-linux-gnu/libgcc_s.so.1 \
        "$CRAFT_PART_INSTALL/lib/x86_64-linux-gnu/libgcc_s.so.1"
      ln -sf /usr/lib64/ld-linux-x86-64.so.2 "$CRAFT_PART_INSTALL/lib/ld-linux-x86-64.so.2"
    organize:
      '*': (component/cuda)
    prime:
      - -(component/cuda)/usr/share/man
      - -(component/cuda)/usr/share/info
      - -(component/cuda)/usr/share/locale

  launcher:
    plugin: dump
    source: snap/local
    organize:
      '*': bin/

components:
  cuda:
    type: standard
    summary: PyTorch and CUDA runtime for local inference
    description: PyTorch, torchvision, Triton, NVIDIA libraries, compiled kernels and the runtime C compiler.
