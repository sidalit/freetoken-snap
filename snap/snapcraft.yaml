name: freetoken
base: core24
version: '0.2.1'
title: FreeToken
icon: snap/gui/freetoken.png
summary: Run large Mixture-of-Experts language models on a local NVIDIA GPU
description: |
  FreeToken is an edge-native Mixture-of-Experts serving engine. It runs
  frontier-scale open-weight models on consumer NVIDIA GPUs by sharing the
  work between the GPU, the CPU and host memory, and serves them through
  OpenAI and Anthropic-compatible HTTP APIs.

  **Examples**

     freetoken serve --model ~/models/Qwen3.6-35B-A3B
     freetoken serve --model Qwen/Qwen3.6-35B-A3B --port 1919
     freetoken shell
     freetoken ctl stats
     freetoken checkpoint --model ~/models/<hf-dir> --out ~/models/<ftw-dir>

  **Requirements**

  An NVIDIA GPU (RTX 30 series or newer) with driver 580 or newer is
  required. The CUDA runtime is included.

  **Files**

  Models downloaded from Hugging Face and runtime caches are kept in
  ~/snap/freetoken/common. Local models can be read from your home
  directory. For models on USB drives and other removable media
  (/media, /mnt), run:

     sudo snap connect freetoken:removable-media

  An optional background service is disabled until a model is configured
  with snap set.
license: Apache-2.0
grade: stable
confinement: strict
website: https://www.flashml.ai/
source-code:
  - https://github.com/FlashML-org/FreeToken
  - https://github.com/sidalit/freetoken-snap
issues:
  - https://github.com/FlashML-org/FreeToken/issues
  - https://github.com/sidalit/freetoken-snap/issues
contact: https://github.com/sidalit/freetoken-snap/issues

platforms:
  amd64:

package-repositories:
  - type: apt
    url: https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/
    path: /
    key-id: EB693B3035CD5710E231E123A4B469963BF863CC

plugs:
  # Python workers need private POSIX semaphores and shared memory.
  shmem:
    interface: shared-memory
    private: true

environment:
  # Prefer the virtual environment over the system Python.
  PATH: $SNAP/bin:$SNAP/usr/bin:$PATH
  LD_LIBRARY_PATH: $SNAP_LIBRARY_PATH
  TRITON_LIBCUDA_PATH: /var/lib/snapd/lib/gl
  CC: $SNAP/bin/freetoken-cc
  PYTHONNOUSERSITE: '1'
  HF_HUB_DISABLE_TELEMETRY: '1'

apps:
  freetoken:
    command: bin/freetoken-launch
    plugs:
      - home
      - removable-media
      - network
      - network-bind
      - opengl
      - shmem

  daemon:
    command: bin/freetoken-daemon
    daemon: simple
    install-mode: disable
    restart-condition: on-failure
    stop-timeout: 60s
    plugs:
      - removable-media
      - network
      - network-bind
      - opengl
      - shmem

parts:
  freetoken:
    plugin: nil
    source: https://github.com/FlashML-org/FreeToken.git
    source-tag: v$SNAPCRAFT_PROJECT_VERSION
    source-depth: 1
    build-packages:
      - build-essential
      - cuda-toolkit-13-0
      - ninja-build
      - python3-dev
      - python3-venv
    build-environment:
      - CUDA_HOME: /usr/local/cuda-13.0
      - PATH: /usr/local/cuda-13.0/bin:$PATH
      - MAX_JOBS: $CRAFT_PARALLEL_BUILD_COUNT
      - TMPDIR: $CRAFT_PART_BUILD
    override-build: |
      /usr/bin/python3 -m venv "$CRAFT_PART_INSTALL"
      "$CRAFT_PART_INSTALL/bin/python3" -m pip install --no-cache-dir \
        'setuptools>=77' wheel 'torch>=2.14,<2.15'
      "$CRAFT_PART_INSTALL/bin/python3" -m pip install --no-cache-dir --no-build-isolation .
      "$CRAFT_PART_INSTALL/bin/python3" -m pip install --no-cache-dir --no-build-isolation ./freetoken-kernel-cache

      site_packages=$("$CRAFT_PART_INSTALL/bin/python3" -c 'import sysconfig; print(sysconfig.get_path("purelib"))')
      find "$site_packages/freetoken" -name '*.so' -exec strip --strip-unneeded {} +
      install -Dm644 LICENSE "$CRAFT_PART_INSTALL/share/doc/freetoken/LICENSE"

      # The environment runs on the base snap's Python 3.12.
      find "$CRAFT_PART_INSTALL/bin" -type f -exec \
        sed -i "1 s|^#!$CRAFT_PART_INSTALL/bin/python3$|#!/usr/bin/env python3|" {} +
    prime:
      # FreeToken's extensions and CUDA kernel cache are already compiled.
      - -lib/python3.*/site-packages/torch/include
      - -lib/python3.*/site-packages/triton/backends/nvidia/lib/cupti*/*.a
      - -lib/python3.*/site-packages/nvidia/*/lib/*.a
      - -lib/python3.*/site-packages/numpy/**/tests

  # Triton still needs a C compiler for its CUDA driver launcher.
  toolchain:
    plugin: nil
    stage-packages:
      - gcc
      - binutils
      - libc6-dev
      - libpython3.12-dev
    override-build: |
      craftctl default
      # Resolve the sysroot's /lib paths against the base's C runtime.
      mkdir -p "$CRAFT_PART_INSTALL/lib/x86_64-linux-gnu"
      for file in libc.so.6 libm.so.6 libgcc_s.so.1; do
        ln -sf "/usr/lib/x86_64-linux-gnu/$file" "$CRAFT_PART_INSTALL/lib/x86_64-linux-gnu/$file"
      done
      ln -sf /usr/lib64/ld-linux-x86-64.so.2 "$CRAFT_PART_INSTALL/lib/ld-linux-x86-64.so.2"
    prime:
      - -usr/share/man
      - -usr/share/info
      - -usr/share/locale

  launcher:
    plugin: dump
    source: snap/local
    organize:
      '*': bin/
